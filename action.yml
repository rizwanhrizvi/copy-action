name: Copy value action
description: Writes an input value's content into a named file.
inputs:
  path:
    required: true
outputs:
  file:
    value: ${{ steps.write.outputs.file }}
runs:
  using: composite
  steps:
    - name: Set output
      id: write
      run: echo "file=${{ inputs.path }}" >> "$GITHUB_OUTPUT"
      shell: bash
